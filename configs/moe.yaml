# ─────────────────────────────────────────────────────────────────────────────
# MoE Training Config — Unsloth grouped-GEMM backend
#
# Architecture: 8-expert Switch-style MoE, top-2 routing, moe_every=2
#   Every other transformer layer has its MLP replaced by a MoELayer.
#   Effective param count is higher than a dense model of the same width.
#
# Dispatch backend (auto-selected at runtime):
#   Fast : conda activate kernel  (PyTorch 2.7+, Triton 3.3)
#          pip install git+https://github.com/unslothai/unsloth
#   Slow : any env — falls back to pure-PyTorch expert loop, no extra deps
#
# Quick smoke test (shakespeare, CPU/GPU, <5 min):
#   python train.py configs/moe.yaml
#
# Full run (openwebtext, GPU):
#   python train.py configs/moe.yaml \
#       --dataset=/home/nanoScaling/training_data/openwebtext \
#       --max_iters=10000 --batch_size=12 --gradient_accumulation_steps=40
# ─────────────────────────────────────────────────────────────────────────────

# I/O
out_dir: "out-moe"
eval_interval: 250
log_interval: 10
eval_iters: 20
eval_only: false
always_save_checkpoint: true
init_from: "scratch"

# Data — shakespeare works out of the box; swap for openwebtext for real runs
# Data
dataset: "/home/nanoScaling/training_data/openwebtext" # 'shakespeare', 'openwebtext'

# Validation dataset folders evaluated at each eval_interval.
# Each entry is a path to a dataset folder (parquet or bin, auto-detected).
# The folder basename is used as the key in TensorBoard (val/loss_<name>).
val_datasets:
  - /home/nanoScaling/val/code_val
  - /home/nanoScaling/val/math_val
  - /home/nanoScaling/val/wikitext_val


gradient_accumulation_steps: 40 # 5 * 8 (example)
batch_size: 12
block_size: 1024

# ── Model ────────────────────────────────────────────────────────────────────
n_layer: 6
n_head:  6
n_embd:  384
dropout: 0.0
bias:    false

# Modern architecture toggles
use_rmsnorm: true
use_rope:    true
use_swiglu:  false   # MoE layers use GELU internally; keep dense layers GELU too

# ── MoE settings ─────────────────────────────────────────────────────────────
use_moe: true

# Expert count and routing
num_experts:         8    # total experts per MoE layer
num_experts_per_tok: 2    # top-k: each token is routed to 2 experts
moe_every:           2    # replace MLP with MoE in layers 0, 2, 4, ...
norm_topk_prob:      true # normalise top-k weights to sum to 1

# Per-expert hidden dim (0 = 4 * n_embd = 1536, aligned to 128)
# Set smaller to reduce per-expert compute if needed, e.g. 512
moe_hidden_dim: 0

# ── Auxiliary losses ─────────────────────────────────────────────────────────
# Both losses are computed per MoE layer and summed into the main CE loss.
#
# Load-balance loss (Switch Transformer):
#   alpha * num_experts * sum_i( f_i * P_i )
#   f_i = fraction of tokens routed to expert i  (non-differentiable)
#   P_i = mean routing probability to expert i   (differentiable)
#   Encourages uniform expert utilization.
load_balance_loss_weight: 0.01

# Router z-loss (ST-MoE / OLMoE):
#   beta * mean( logsumexp(router_logits)^2 )
#   Penalises large logit magnitude → stabilises routing.
router_z_loss_weight: 0.001

# ── Optimizer ────────────────────────────────────────────────────────────────
optimizer:     "adamw"
learning_rate: 3e-4
weight_decay:  0.1
beta1:         0.9
beta2:         0.95
grad_clip:     1.0

# LR schedule
decay_lr:        true
warmup_iters:    100
lr_decay_iters:  2000
min_lr:          3e-5
max_iters:       2000

# ── System ───────────────────────────────────────────────────────────────────
device:  "cuda"
dtype:   "bfloat16"
compile: true   # set true when using the kernel env (unsloth path)

# Logging
tensorboard_log:      true
tensorboard_run_name: "moe-run"
