# SFT Configuration
#
# Generate data first:
#   python data/prepare_sft.py --datasets alpaca
#   python data/prepare_sft.py --datasets alpaca ultrachat   # recommended
#
# Then train:
#   python train_sft.py configs/sft.yaml
#   python train_sft.py configs/sft.yaml --init_from=out/ckpt.pt  # from pretrained

out_dir: "out-sft"
eval_interval: 500
log_interval: 10
metrics_log_interval: 50
eval_iters: 50
eval_only: False
checkpoint_interval: 500
keep_last_n_checkpoints: 3

# Initialise from a pretrained checkpoint for real fine-tuning,
# or "scratch" for quick tests.
init_from: "scratch"

# Dataset produced by data/prepare_sft.py (default output_dir = data/sft)
dataset: "sft"

gradient_accumulation_steps: 4
batch_size: 8
block_size: 1024

# Model — match the pretrained checkpoint's architecture when fine-tuning.
# These defaults match a small model for quick smoke tests.
n_layer: 6
n_head: 6
n_embd: 384
dropout: 0.1
bias: False
use_rmsnorm: True
use_rope: True
use_swiglu: True

# Optimizer — AdamW is the safe default for SFT.
# Use muon for faster convergence when fine-tuning large models.
optimizer: "adamw"
learning_rate: 3e-4
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
decay_lr: True
warmup_iters: 100
lr_decay_iters: 5000
min_lr: 3e-5
max_iters: 5000

# Hardware
device: "cuda"
dtype: "bfloat16"
compile: False

# Logging
tensorboard_log: True
tensorboard_run_name: "sft"
use_wandb: False
# wandb_project: "nanoscaling-sft"
# wandb_run_name: "sft-alpaca"
