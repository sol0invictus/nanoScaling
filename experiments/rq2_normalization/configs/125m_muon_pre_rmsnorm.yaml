# RQ2 Condition 1/6: Muon + Pre-RMSNorm (standard baseline)
# Expected: stable training; serves as Muon reference point.

out_dir: out/rq2/125m_muon_pre_rmsnorm
tensorboard_run_name: rq2_125m_muon_pre_rmsnorm
tensorboard_log: true

dataset: openwebtext
# dataset: shakespeare_char  # for quick smoke tests

n_layer: 12
n_head: 12
n_embd: 768
block_size: 2048
bias: false
dropout: 0.0

use_rmsnorm: true
use_rope: true
use_swiglu: true
use_flash_attn3: false  # set true on H100 Hopper GPUs (requires: pip install flash-attn>=3.0)

norm_position: pre
norm_affine: true
norm_free_scaled_init: false

optimizer: muon
muon_lr: 0.02
muon_momentum: 0.95
muon_ns_steps: 5
muon_weight_decay: 0.1
learning_rate: 3e-4
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

decay_lr: true
warmup_iters: 200
lr_decay_iters: 5000
min_lr: 3e-5

batch_size: 32
gradient_accumulation_steps: 16
max_iters: 5000

eval_interval: 250
log_interval: 10
metrics_log_interval: 50   # TensorBoard/CSV logging frequency (0 = same as log_interval)
eval_iters: 100
always_save_checkpoint: true
checkpoint_interval: 2000

device: cuda
dtype: bfloat16
compile: false
