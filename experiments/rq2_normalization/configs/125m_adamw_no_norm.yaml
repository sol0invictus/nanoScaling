# RQ2 Condition 4/6: AdamW + No Normalization
# H2a hypothesis: AdamW diverges without normalization at equivalent depth.
# norm_position=none → all ln_1, ln_2, ln_f are nn.Identity().
# Expected: divergence or significantly worse performance than Muon + No Norm.

out_dir: out/rq2/125m_adamw_no_norm
tensorboard_run_name: rq2_125m_adamw_no_norm
tensorboard_log: true

dataset: shakespeare_char
# dataset: openwebtext

n_layer: 12
n_head: 12
n_embd: 768
block_size: 1024
bias: false
dropout: 0.0

use_rmsnorm: true   # ignored when norm_position=none, but kept for param count consistency
use_rope: true
use_swiglu: true
use_flash_attn3: false  # set true on H100 Hopper GPUs (requires: pip install flash-attn>=3.0)

norm_position: none   # ← No normalization anywhere
norm_affine: true
norm_free_scaled_init: false

optimizer: adamw
learning_rate: 3e-4
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

decay_lr: true
warmup_iters: 400
lr_decay_iters: 20000
min_lr: 3e-5

batch_size: 12
gradient_accumulation_steps: 40
max_iters: 20000

eval_interval: 500
log_interval: 10
metrics_log_interval: 50   # TensorBoard/CSV logging frequency (0 = same as log_interval)
eval_iters: 100
always_save_checkpoint: true

device: cuda
dtype: bfloat16
compile: false
