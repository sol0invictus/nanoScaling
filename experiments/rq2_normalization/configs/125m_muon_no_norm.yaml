# RQ2 Condition 4/6: Muon + No Normalization
# H2a hypothesis (core novelty): Muon trains stably without any normalization
# where AdamW fails. Spectral control of weight matrices substitutes for LayerNorm.
# Gate experiment: if stable at 5B tokens, scale to 370M immediately.

out_dir: out/rq2/125m_muon_no_norm
tensorboard_run_name: rq2_125m_muon_no_norm
tensorboard_log: true

dataset: shakespeare_char
# dataset: openwebtext

n_layer: 12
n_head: 12
n_embd: 768
block_size: 1024
bias: false
dropout: 0.0

use_rmsnorm: true   # ignored when norm_position=none
use_rope: true
use_swiglu: true

norm_position: none   # ← No normalization
norm_affine: true
norm_free_scaled_init: false

optimizer: muon
muon_lr: 0.02
muon_momentum: 0.95
muon_ns_steps: 5
learning_rate: 3e-4
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

decay_lr: true
warmup_iters: 400
lr_decay_iters: 20000
min_lr: 3e-5

batch_size: 12
gradient_accumulation_steps: 40
max_iters: 20000

eval_interval: 500
log_interval: 10
eval_iters: 100
always_save_checkpoint: true

device: cuda
dtype: bfloat16
compile: false

# Research / experiment logging (see utils/research_config.py)
research:
  enable_spectral_logging: true
  enable_stability_monitor: true
  proportional_lr_decay: true
  svd_checkpoint_freq: 2000
