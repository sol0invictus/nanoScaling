# RQ1 Baseline: 125M AdamW + Pre-RMSNorm
# Trains to 20B tokens (~40K iters at ~512K tokens/iter).
# For quick iteration use max_iters=1000 and dataset=shakespeare_char.
# Model — 125M (GPT-2 small)


out_dir: out/rq1/125m_adamw
tensorboard_run_name: rq1_125m_adamw
tensorboard_log: true

eval_interval: 50
log_interval: 10
metrics_log_interval: 50   # TensorBoard/CSV logging frequency (0 = same as log_interval)
eval_iters: 5
eval_only: false
checkpoint_interval: 100    # 0 = save at eval_interval; set > 0 to decouple (e.g. 5000)
always_save_checkpoint: true
keep_last_n_checkpoints: 3  # keep N most recent ckpt_NNNNNNN.pt files (0 = keep all)
init_from: "scratch" # 'scratch', 'resume', 'gpt2*'

# Data
dataset: "/home/nanoScaling/training_data/openwebtext" # 'shakespeare', 'openwebtext'

# Validation dataset folders evaluated at each eval_interval.
# Each entry is a path to a dataset folder (parquet or bin, auto-detected).
# The folder basename is used as the key in TensorBoard (val/loss_<name>).
val_datasets:
  - /home/nanoScaling/val/code_val
  - /home/nanoScaling/val/math_val
  - /home/nanoScaling/val/wikitext_val

gradient_accumulation_steps: 40 # 5 * 8 (example)
batch_size: 12
block_size: 1024

# Model Architecture
n_layer: 12
n_head: 12
n_embd: 768
block_size: 1024
bias: false
dropout: 0.0


# Architecture Toggles
use_rmsnorm: true
use_rope: true
use_swiglu: true

# Normalization (standard Pre-LN with affine)
norm_position: pre
norm_affine: true


# Optimizer: AdamW
optimizer: adamw
learning_rate: 3e-4
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0


# LR Scheduler
decay_lr: true
warmup_iters: 2000
lr_decay_iters: 40000
min_lr: 6e-5

max_iters: 40000

# System
device: "cuda"
dtype: "bfloat16" # 'float32', 'bfloat16', 'float16'
compile: true
backend: "nccl"

# Parametrization
# Controls initialization and learning rate scaling logic.
parametrization:
  mode: "SP" # 'SP' (Standard), 'MuP' (Maximal Update), 'CompleteP'
