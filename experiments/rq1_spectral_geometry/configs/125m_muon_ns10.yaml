# RQ1 Ablation: Muon with ns_steps=10 (higher orthogonalization quality)
# Tests if more NS steps yield stronger spectral regularization.

out_dir: out/rq1/125m_muon_ns10
tensorboard_run_name: rq1_125m_muon_ns10
tensorboard_log: true

dataset: /home/nanoScaling/data/shakespeare
# dataset: openwebtext

n_layer: 12
n_head: 12
n_embd: 768
block_size: 1024
bias: false
dropout: 0.0

use_rmsnorm: true
use_rope: true
use_swiglu: true
norm_position: pre
norm_affine: true

optimizer: muon
muon_lr: 0.02
muon_momentum: 0.95
muon_ns_steps: 10      # ← ablation: more Newton-Schulz steps
learning_rate: 3e-4
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

decay_lr: true
warmup_iters: 800
lr_decay_iters: 40000
min_lr: 3e-5

batch_size: 12
gradient_accumulation_steps: 40
max_iters: 40000

eval_interval: 500
log_interval: 10
eval_iters: 100
always_save_checkpoint: true

device: cuda
dtype: bfloat16
compile: false
