# RQ1 Baseline: 125M Muon + Pre-RMSNorm
# Primary experimental condition for RQ1 spectral geometry study.
# Matched architecture and training duration to 125m_adamw.yaml.

out_dir: out/rq1/125m_muon
tensorboard_run_name: rq1_125m_muon
tensorboard_log: true

dataset: /home/nanoScaling/data/shakespeare
# dataset: openwebtext

# Model — 125M (GPT-2 small), identical to AdamW baseline
n_layer: 12
n_head: 12
n_embd: 768
block_size: 1024
bias: false
dropout: 0.0

use_rmsnorm: true
use_rope: true
use_swiglu: true

norm_position: pre
norm_affine: true

# Optimizer: Muon (2D params) + AdamW (1D/embeddings)
# Muon: β=0.95, lr=0.02, ns_steps=5  (proposal defaults)
# AdamW: lr=3e-4 for 1D params
optimizer: muon
muon_lr: 0.02
muon_momentum: 0.95
muon_ns_steps: 5
learning_rate: 3e-4    # AdamW learning rate for 1D params
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

decay_lr: true
warmup_iters: 800
lr_decay_iters: 40000
min_lr: 3e-5

batch_size: 12
gradient_accumulation_steps: 10
max_iters: 100

# Checkpointing
eval_interval: 500
log_interval: 10
eval_iters: 100
always_save_checkpoint: true

device: cuda
dtype: bfloat16
compile: false

# Research / experiment logging (see utils/research_config.py)
research:
  enable_spectral_logging: true
  proportional_lr_decay: true
  svd_checkpoint_freq: 2000
