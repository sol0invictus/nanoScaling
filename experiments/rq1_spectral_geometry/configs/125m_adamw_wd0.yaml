# RQ1 Control: AdamW with weight_decay=0 (no L2 regularization)
# Symmetric control to 125m_muon.yaml (Muon also has WD=0 by default).
# Isolates the optimizer's intrinsic spectral effect from regularization:
#   Muon(WD=0) vs AdamW(WD=0) is the cleanest comparison of update rule geometry.
# Identical to 125m_adamw.yaml except weight_decay=0.

out_dir: out/rq1/125m_adamw_wd0
tensorboard_run_name: rq1_125m_adamw_wd0
tensorboard_log: true

eval_interval: 500
log_interval: 1
metrics_log_interval: 100
eval_iters: 5
eval_only: false
checkpoint_interval: 1000
always_save_checkpoint: true
keep_last_n_checkpoints: 3
init_from: "scratch"

# Data
dataset: "/home/nanoScaling/training_data/openwebtext"

val_datasets:
  - /home/nanoScaling/val/code_val
  - /home/nanoScaling/val/math_val
  - /home/nanoScaling/val/wikitext_val

gradient_accumulation_steps: 16
batch_size: 32
block_size: 2048

# Model Architecture
n_layer: 12
n_head: 12
n_embd: 768
bias: false
dropout: 0.0

# Architecture Toggles
use_rmsnorm: true
use_rope: true
use_swiglu: true
use_flash_attn3: false  # set true on H100 Hopper GPUs (requires: pip install flash-attn>=3.0)

norm_position: pre
norm_affine: true

# Optimizer: AdamW — no weight decay
optimizer: adamw
learning_rate: 3e-4
weight_decay: 0.0        # ← ablation: no L2 regularization (default=0.1)
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

# LR Scheduler
decay_lr: true
warmup_iters: 200
lr_decay_iters: 5000
min_lr: 6e-5

max_iters: 5000

# System
device: "cuda"
dtype: "bfloat16"
compile: true
backend: "nccl"

# Parametrization
parametrization:
  mode: "SP"
